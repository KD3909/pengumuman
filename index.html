<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom 3909 — Royal Portal</title>
<meta name="description" content="Portal resmi Kingdom 3909 Rise of Kingdoms: pengumuman, event, ranking governor, alliance, dan aturan kerajaan.">
<meta property="og:title" content="Kingdom 3909 — Royal Portal"><meta property="og:description" content="Pengumuman, event, ranking governor, dan alliance Kingdom 3909."><meta name="theme-color" content="#070a11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#d8b45a;--g2:#f2d98b;--t:#eef2f7;--m:#93a0b4;--l:rgba(216,180,90,.22);--r:#ef7b7b;--ok:#61d39a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--t);font:15px/1.65 Inter,"Segoe UI",system-ui,Arial,sans-serif;background:radial-gradient(900px 500px at 85% -10%,rgba(216,180,90,.17),transparent 60%),radial-gradient(800px 600px at -10% 25%,#16264a,transparent 55%),#070a11;background-attachment:fixed}
a{color:inherit;text-decoration:none}.w{width:min(1120px,92%);margin:auto}
h1,h2,.br{font-family:Cinzel,Georgia,"Times New Roman",serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(6,9,15,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--l)}
.nv{display:flex;align-items:center;gap:14px;min-height:60px;padding:6px 0}.br{font-weight:800;letter-spacing:1.5px;white-space:nowrap;margin-right:auto}.br b,.gold{color:var(--g2)}
.nl{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.nl::-webkit-scrollbar{display:none}.na{display:flex;gap:8px}
.nv a.l{color:#c8d0dc;font-size:14px;padding:7px 12px;border-radius:99px;white-space:nowrap;transition:.2s}.nv a.l:hover,.nv a.on{color:#0a0c10;background:linear-gradient(135deg,#f2d98b,#c99b3f)}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;border:1px solid var(--l);background:#151c2a;color:var(--g2);font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--g)}.pri{background:linear-gradient(135deg,#f0d57f,#b98a35);color:#0a0c10;border:0;box-shadow:0 4px 18px rgba(216,180,90,.25)}.dng{color:var(--r)}.sm{padding:6px 12px;font-size:13px}
h1{font-size:clamp(56px,13vw,110px);line-height:.95;margin:8px 0;background:linear-gradient(180deg,#fff,#f0dc9c 50%,#a77a2c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(216,180,90,.25))}
h2{font-size:24px;margin:0 0 14px}h3{font-size:17px}.k{color:var(--g);letter-spacing:3px;font-size:11px;font-weight:800}.mu{color:var(--m)}
.hero{padding:64px 0 26px;text-align:center}.hero p{max-width:620px;margin:10px auto 18px;color:var(--m);font-size:17px}.hero .row{justify-content:center}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g .st{text-align:center}
.card{background:linear-gradient(160deg,rgba(20,28,44,.92),rgba(11,15,24,.94));border:1px solid var(--l);border-radius:16px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.28);transition:.25s}.g>.card:hover{transform:translateY(-3px);border-color:var(--g)}.card h3{margin:8px 0 4px}
.st b{display:block;font-size:30px;color:var(--g2);font-family:Cinzel,Georgia,serif}.st span{color:var(--m);font-size:13px}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;border:1px solid var(--l);color:var(--g2);background:rgba(216,180,90,.07)}
section{padding:30px 0}.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;min-width:480px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}th{color:var(--g2);font-size:11px;text-transform:uppercase;letter-spacing:1px}tbody tr:hover,tr:hover td{background:rgba(216,180,90,.05)}
.rk{font-weight:800;color:var(--g2);width:48px;font-size:16px}
input,select,textarea{width:100%;background:#080d15;color:#fff;border:1px solid var(--l);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;outline:0;transition:.2s}input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(216,180,90,.15)}
label{display:block;margin-bottom:12px;font-size:13px;color:var(--m)}label input,label select,label textarea{margin-top:5px}code{background:#0a1019;padding:1px 6px;border-radius:5px;color:var(--g2)}
.ad{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}.sd{position:sticky;top:76px}.sd a{display:block;padding:10px 12px;border-radius:9px;color:#aeb8c7}.sd a.on,.sd a:hover{background:#171f2e;color:var(--g2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:30;padding:16px}.mod{width:min(520px,100%);max-height:90vh;overflow:auto;animation:pop .2s}@keyframes pop{from{opacity:0;transform:scale(.96)}}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90%;background:#1b2435;border:1px solid var(--g);padding:11px 18px;border-radius:12px;z-index:40;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ld{padding:90px 0;text-align:center;color:var(--m)}.ld i{display:inline-block;width:18px;height:18px;border:3px solid var(--l);border-top-color:var(--g2);border-radius:50%;vertical-align:-4px;margin-right:8px;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.setup{max-width:640px;margin:40px auto}.setup li{margin-bottom:8px}.pwf{margin-top:18px;padding-top:14px;border-top:1px solid var(--l)}
footer{padding:30px 0 40px;color:var(--m);font-size:13px;border-top:1px solid var(--l);margin-top:30px;text-align:center}
@media(max-width:760px){.nv{flex-wrap:wrap;gap:6px 10px}.nl{order:3;width:100%;padding-bottom:4px}.hero{padding:36px 0 16px}.hero p{font-size:15px}
.ad{grid-template-columns:1fr}.sd{position:static;display:flex;gap:6px;overflow-x:auto;padding:8px}.sd a{white-space:nowrap;padding:8px 14px;border:1px solid var(--l);border-radius:99px}
.g{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.card{padding:14px}h2{font-size:21px}th,td{padding:9px 8px;font-size:13px}.ov{align-items:end;padding:0}.mod{border-radius:18px 18px 0 0;width:100%}}
</style></head><body>
<nav><div class="w nv" id="nav"></div></nav>
<main class="w" id="app"><div class="ld"><i></i> Memuat portal…</div></main>
<footer><div class="w" id="ft"></div></footer>
<div id="m"></div><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
window.onerror=(m)=>{const a=document.getElementById('app');if(a)a.innerHTML='<div class="card" style="margin-top:30px"><b>Kesalahan skrip:</b> '+String(m).replace(/</g,'&lt;')+'</div>'};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const s=String(v??'').replace(/[^\d]/g,'');return s?+s:0};
const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n.toLocaleString('id-ID');
const empty=()=>({set:{name:'Kingdom 3909',motto:'United We Rise, Together We Conquer.'},governors:[],alliances:[],events:[],news:[],rules:[],users:[],audit:[]});
let D=empty(),me=null,CS='',HU=false;
const toMail=s=>{s=String(s).trim().toLowerCase();return s.includes('@')?s:s+'@kingdom3909.app'};
function toast(x){const t=$('#t');t.textContent=x;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',6000)}
const al=id=>D.alliances.find(a=>a.id===id);

/* ===== Definisi entitas & izin ===== */
const AL=['alliance'],E={
governors:{t:'Governor',f:[['gameId','Game ID'],['name','Nama'],['allianceId','Alliance','alliance'],['power','Power','n'],['kp','Kill Points','n'],['deads','Deads','n']]},
alliances:{t:'Alliance',f:[['tag','Tag'],['name','Nama'],['leader','Leader'],['territory','Wilayah']]},
events:{t:'Event',f:[['title','Judul'],['date','Tanggal','date'],['category','Kategori','sel:Kingdom,Alliance,KvK,MGE,Lainnya'],['allianceId','Alliance','alliance'],['desc','Deskripsi','ta']]},
news:{t:'Pengumuman',f:[['title','Judul'],['category','Kategori','sel:Penting,Event,KvK,Umum'],['allianceId','Alliance','alliance'],['content','Isi','ta']]},
rules:{t:'Aturan',f:[['title','Judul'],['content','Isi','ta']]},
users:{t:'User',f:[['username','Username'],['role','Role','sel:member,alliance_admin,council,super_admin'],['allianceId','Alliance (untuk alliance_admin)','alliance']]}};
const MENU={super_admin:['governors','alliances','events','news','rules','users'],council:['governors','alliances','events','news','rules','users'],alliance_admin:['governors','alliances','events','news']};
// boleh ubah/tambah item?  (item null = tambah baru)
function can(e,it){if(!me)return false;const r=me.role;if(r==='super_admin')return true;
 if(e==='users')return r==='council'&&(!it||it.role!=='super_admin');
 if(r==='council')return true;
 if(r==='alliance_admin'&&me.allianceId){if(e==='rules'||e==='users')return false;if(e==='alliances')return !!it&&it.id===me.allianceId;return !it||it.allianceId===me.allianceId}return false}
function canDel(e,it){if(e==='users'||!can(e,it))return false;if(me.role==='alliance_admin'&&(e==='governors'||e==='alliances'))return false;return true}
const nSA=()=>D.users.filter(u=>u.role==='super_admin').length;

/* ===== Router & tampilan ===== */
const PUB=[['','Beranda'],['kingdom','Kingdom'],['ranking','Ranking'],['governors','Governor'],['events','Event'],['news','News'],['rules','Rules']];
function route(sc){const h=location.hash.slice(1)||'',[a,b]=h.split('/');
 $('#nav').innerHTML=`<a class="br" href="#">♛ KINGDOM <b>${esc(D.set.name.replace(/\D/g,'')||'3909')}</b></a><div class="nl">`+PUB.map(([p,l])=>`<a class="l ${a===p&&a!=='admin'?'on':''}" href="#${p}">${l}</a>`).join('')+`</div><div class="na">`+(me?`<a class="btn sm pri" href="#admin">⚙ Panel</a><a class="btn sm" data-a="out">Keluar</a>`:`<a class="btn sm pri" href="#login">🔑 Masuk</a>`)+`</div>`;
 $('#ft').textContent=`© ${new Date().getFullYear()} ${D.set.name} • Rise of Kingdoms community`;
 let h2;if(a==='admin')h2=me?Adm(b||'dash'):'<section class="card">Silakan <a class="gold" href="#login">masuk</a> terlebih dahulu.</section>';
 else h2=(Object.hasOwn(V,a||'home')?V[a||'home']:V.home)(b);
 $('#app').innerHTML=h2;if(sc===true)window.scrollTo(0,0)}
addEventListener('hashchange',()=>route(true));

const topBy=(k,t)=>[...D.governors].sort((x,y)=>y[k]-x[k]).slice(0,t);
const rowG=(g,i)=>`<tr><td class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${esc(g.name)}</td><td>${esc(al(g.allianceId)?.tag||'—')}</td><td>${fmt(g.power)}</td><td>${fmt(g.kp)}</td><td>${fmt(g.deads)}</td></tr>`;
const thG='<tr><th>#</th><th>Governor</th><th>Alliance</th><th>Power</th><th>KP</th><th>Deads</th></tr>';
const newsC=n=>`<div class="card"><span class="bd">${esc(n.category)}</span>${n.allianceId?` <span class="bd">${esc(al(n.allianceId)?.tag||'')}</span>`:''}<h3>${esc(n.title)}</h3><p class="mu" style="white-space:pre-line">${esc(n.content)}</p></div>`;
const evs=()=>[...D.events].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const V={
home(){const P=D.governors.reduce((s,g)=>s+g.power,0);return`<div class="hero"><div class="k">👑 THE ROYAL KINGDOM PORTAL</div><h1>${esc(D.set.name.replace(/\D/g,'')||'3909')}</h1><h2 class="gold">${esc(D.set.motto)}</h2><p>Pusat pengumuman, event, ranking governor, alliance, dan administrasi kerajaan.</p><div class="row"><a class="btn pri" href="#ranking">🏆 Lihat Ranking</a><a class="btn" href="#events">📅 Event</a>${me?'':'<a class="btn" href="#login">🔑 Masuk Panel</a>'}</div></div>
<div class="g"><div class="card st"><span>⚔️ Total Power</span><b>${fmt(P)}</b></div><div class="card st"><span>👥 Governors</span><b>${D.governors.length}</b></div><div class="card st"><span>🛡️ Alliances</span><b>${D.alliances.length}</b></div><div class="card st"><span>📅 Event</span><b>${D.events.length}</b></div></div>
<section><div class="k">ROYAL COMMUNICATION</div><h2>Pengumuman Terbaru</h2><div class="g">${D.news.slice(0,3).map(newsC).join('')||'<p class="mu">Belum ada pengumuman.</p>'}</div></section>
<section><div class="k">ROYAL CALENDAR</div><h2>Event</h2><div class="g">${evs().slice(0,3).map(e=>`<div class="card"><span class="bd">${esc(e.date)}</span><h3>${esc(e.title)}</h3><p class="mu">${esc(e.desc)}</p></div>`).join('')||'<p class="mu">Belum ada event.</p>'}</div></section>
${!HU?'<div class="card">Portal baru. <a class="gold" href="#login/daftar">Buat akun Super Admin</a> untuk mulai mengelola data.</div>':''}`},
kingdom(){return`<section><div class="k">KINGDOM OVERVIEW</div><h2>Alliances</h2><div class="g">${D.alliances.map(a=>`<div class="card"><span class="bd">${esc(a.tag)}</span><h3>${esc(a.name)}</h3><p class="mu">Leader: ${esc(a.leader||'—')}<br>Wilayah: ${esc(a.territory||'—')}<br>Anggota: ${D.governors.filter(g=>g.allianceId===a.id).length} • Power: ${fmt(D.governors.filter(g=>g.allianceId===a.id).reduce((s,g)=>s+g.power,0))}</p></div>`).join('')||'<p class="mu">Belum ada alliance.</p>'}</div></section>`},
ranking(c='power'){const k={power:'power',kp:'kp',deads:'deads'}[c]||'power';return`<section><div class="k">LEADERBOARD</div><h2>Royal Rankings</h2><div class="tabs">${[['power','Power'],['kp','Kill Points'],['deads','Deads']].map(([x,l])=>`<a class="btn sm ${k===x?'pri':''}" href="#ranking/${x}">${l}</a>`).join('')}</div><div class="card tw"><table>${thG}${topBy(k,100).map(rowG).join('')}</table></div></section>`},
governors(){return`<section><h2>Governors</h2><input id="q" placeholder="Cari nama / alliance…" data-q="g" style="max-width:340px;margin-bottom:12px"><div class="card tw"><table>${thG}<tbody id="gl">${topBy('power',500).map(rowG).join('')}</tbody></table></div></section>`},
events(){return`<section><h2>Royal Events</h2><div class="g">${evs().map(e=>`<div class="card"><span class="bd">${esc(e.date)}</span> <span class="bd">${esc(e.category)}</span>${e.allianceId?` <span class="bd">${esc(al(e.allianceId)?.tag||'')}</span>`:''}<h3>${esc(e.title)}</h3><p class="mu">${esc(e.desc)}</p></div>`).join('')||'<p class="mu">Belum ada event.</p>'}</div></section>`},
news(){return`<section><h2>Announcements</h2><div class="g">${D.news.map(newsC).join('')||'<p class="mu">Belum ada pengumuman.</p>'}</div></section>`},
rules(){return`<section><h2>Royal Law</h2>${D.rules.map(r=>`<div class="card" style="margin-bottom:12px"><h3 class="gold">${esc(r.title)}</h3><p class="mu" style="white-space:pre-line">${esc(r.content)}</p></div>`).join('')||'<p class="mu">Belum ada aturan.</p>'}</section>`},
login(b){const reg=b==='daftar';return`<section style="max-width:420px;margin:auto"><div class="card"><h2>${reg?'Daftar Akun':'Masuk Royal Panel'}</h2>${!HU?'<p class="mu">Belum ada admin. Akun pertama yang mendaftar otomatis menjadi <b class="gold">Super Admin</b>.</p>':reg?'<p class="mu">Setelah mendaftar, Super Admin akan memberi role pada akun Anda.</p>':''}<form data-k="${reg?'signup':'login'}">${reg?'<label>Email<input name="email" type="email" required autocomplete="email"></label>':'<label>Username atau Email<input name="email" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>'}${reg?'<label>Username (3-32 karakter)<input name="u" required minlength="3" maxlength="32"></label>':''}<label>Password${reg?' (min. 8 karakter)':''}<input name="p" type="password" required ${reg?'minlength="8"':''} autocomplete="${reg?'new-password':'current-password'}"></label><p id="fe" style="color:var(--r);margin:0 0 10px"></p><button class="btn pri" style="width:100%">${reg?'Daftar':'Masuk'}</button></form><p class="mu" style="margin-bottom:0">${reg?'Sudah punya akun? <a class="gold" href="#login">Masuk</a>':'Belum punya akun? <a class="gold" href="#login/daftar">Daftar</a>'}</p></div></section>`}};

/* ===== Panel admin ===== */
function Adm(p){const menu=MENU[me.role]||[],ex=['super_admin','council'].includes(me.role)?['import','set']:[],sa=me.role==='super_admin'?['audit','backup']:[];
 const side=`<div class="card sd"><a class="${p==='dash'?'on':''}" href="#admin">Dashboard</a>${menu.map(e=>`<a class="${p===e?'on':''}" href="#admin/${e}">${E[e].t}</a>`).join('')}${ex.map(x=>`<a class="${p===x?'on':''}" href="#admin/${x}">${x==='set'?'Pengaturan':'Impor CSV'}</a>`).join('')}${sa.map(x=>`<a class="${p===x?'on':''}" href="#admin/${x}">${x==='audit'?'Audit Log':'Backup'}</a>`).join('')}</div>`;
 let body;
 if(p==='dash')body=`<div class="card"><h2>Selamat datang, ${esc(me.username)}</h2><p class="mu">Role: <b class="gold">${esc(me.role)}</b>${me.allianceId?' • Alliance: '+esc(al(me.allianceId)?.tag||'?'):''}</p><div class="g">${menu.map(e=>`<div class="card st"><span>${E[e].t}</span><b>${D[e].length}</b></div>`).join('')}</div>${me.role!=='alliance_admin'&&!D.governors.length?'<p><button class="btn" data-a="demo">Isi data contoh (fiktif)</button></p>':''}<p class="mu">Data tersimpan di database Supabase dan dibagikan ke semua admin.</p><form data-k="pw" class="pwf"><h3>🔒 Ganti Password</h3><div class="g"><label>Password baru<input name="p1" type="password" minlength="6" required autocomplete="new-password"></label><label>Ulangi password<input name="p2" type="password" minlength="6" required autocomplete="new-password"></label></div><button class="btn pri">Simpan Password</button></form>${!menu.length?'<p class="gold">Akun Anda belum memiliki akses admin. Hubungi Super Admin untuk diberi role.</p>':''}</div>`;
 else if(p==='set'&&ex.length)body=`<div class="card"><h2>Pengaturan Kingdom</h2><form data-k="set"><label>Nama Kingdom<input name="name" value="${esc(D.set.name)}"></label><label>Motto<input name="motto" value="${esc(D.set.motto)}"></label><label>Nama King<input name="king" value="${esc(D.set.king||'')}"></label><button class="btn pri">Simpan</button></form></div>`;
 else if(p==='import'&&ex.length)body=`<div class="card"><h2>Impor CSV Governor</h2><p class="mu">Kolom: <code>game_id,name,power,kill_points,deads,alliance_tag</code>. Pemisah , atau ; — angka boleh memakai titik/koma ribuan. Data dengan game_id sama akan diperbarui.</p><form data-k="csv"><input type="file" name="f" accept=".csv,text/csv" required><p><button class="btn pri">Impor</button></p></form><div id="rep"></div></div>`;
 else if(p==='audit'&&sa.length)body=`<div class="card tw"><h2>Audit Log</h2><table><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Target</th><th>Detail</th></tr>${D.audit.map(a=>`<tr><td>${esc(a.at.replace('T',' ').slice(0,19))}</td><td>${esc(a.u)}</td><td>${esc(a.a)}</td><td>${esc(a.t)}</td><td>${esc(a.d)}</td></tr>`).join('')}</table></div>`;
 else if(p==='backup'&&sa.length)body=`<div class="card"><h2>Backup</h2><p class="mu">Unduh salinan data (governor, alliance, event, news, rules, user) sebagai JSON. Cadangan otomatis juga tersedia di dashboard Supabase.</p><p><button class="btn" data-a="exp">Unduh cadangan JSON</button></p></div>`;
 else if(menu.includes(p))body=List(p);
 else body='<div class="card">Halaman tidak tersedia untuk role Anda.</div>';
 return`<section><div class="ad">${side}<div>${body}</div></div></section>`}
const cell=(f,it)=>f[2]==='alliance'?esc(al(it[f[0]])?.tag||'—'):f[2]==='n'?fmt(it[f[0]]||0):esc(String(it[f[0]]??'').slice(0,60));
function List(e){const c=E[e],cols=c.f.filter(f=>f[2]!=='pw'&&f[2]!=='ta').slice(0,5);
 return`<div class="card"><div class="row"><h2 style="margin:0;margin-right:auto">${c.t}</h2><input data-q="t" placeholder="Cari…" style="max-width:200px">${e!=='users'&&can(e,null)?`<button class="btn pri" data-a="new" data-e="${e}">+ Tambah</button>`:''}</div><div class="tw"><table><tr>${cols.map(f=>`<th>${f[1].split(' (')[0]}</th>`).join('')}<th></th></tr><tbody id="tb">${D[e].map(it=>`<tr><td>${cols.map(f=>cell(f,it)).join('</td><td>')}</td><td style="white-space:nowrap">${can(e,it)?`<button class="btn sm" data-a="edit" data-e="${e}" data-i="${it.id}">Ubah</button> `:''}${canDel(e,it)?`<button class="btn sm dng" data-a="del" data-e="${e}" data-i="${it.id}">Hapus</button>`:''}</td></tr>`).join('')||`<tr><td colspan="9" class="mu">Belum ada data.</td></tr>`}</tbody></table></div></div>`}
function inp(f,v){const[k,l,t='']=f;let x;
 if(t==='alliance'){const fo=me.role==='alliance_admin';x=`<select name="${k}" ${fo?'disabled':''}><option value="">— tanpa alliance / seluruh kingdom —</option>${D.alliances.map(a=>`<option value="${a.id}" ${(fo?me.allianceId:v)===a.id?'selected':''}>${esc(a.tag)} — ${esc(a.name)}</option>`).join('')}</select>`}
 else if(t.startsWith('sel:'))x=`<select name="${k}">${t.slice(4).split(',').filter(o=>!(o==='super_admin'&&me.role!=='super_admin')).map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(t==='ta')x=`<textarea name="${k}" rows="4">${esc(v)}</textarea>`;
 else x=`<input name="${k}" type="${t==='pw'?'password':t==='date'?'date':'text'}" value="${t==='pw'?'':esc(v)}" ${t==='pw'?'autocomplete="new-password"':''}>`;
 return`<label>${l}${x}</label>`}
const modal=h=>$('#m').innerHTML=h?`<div class="ov"><div class="card mod">${h}</div></div>`:'';

/* ===== Supabase (database + login) ===== */
const C=window.K3909||{};let sb=null;
const camel=k=>k==='description'?'desc':k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
const snake=k=>k==='desc'?'description':k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase());
const fromDB=r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[camel(k),v??'']));
const toDB=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[snake(k),v]));
const TB={governors:'governors',alliances:'alliances',events:'events',news:'news',rules:'rules',users:'profiles'};
const errT=e=>/row-level security|permission denied/i.test(e.message)?'Tidak diizinkan untuk role Anda':e.code==='23505'?'Data dengan Game ID / Tag yang sama sudah ada':e.message;
const must=async p=>{const{data,error}=await p;if(error)throw new Error(errT(error));return data};
async function pages(mk){const out=[];for(let i=0;;i+=1000){const d=await must(mk().range(i,i+999));out.push(...d);if(d.length<1000)break}return out}
async function refresh(){
 if(!sb){if(!C.url||!C.key||C.url.includes('ISI-')||!window.supabase)throw new Error('Isi dulu url & key Supabase di config.js');sb=supabase.createClient(C.url,C.key)}
 const{data:{session}}=await sb.auth.getSession();me=null;
 if(session){const p=await must(sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle());if(p)me={id:p.id,username:p.username,role:p.role,allianceId:p.alliance_id||''}}
 const staff=!!me&&['super_admin','council','alliance_admin'].includes(me.role),adm=!!me&&['super_admin','council'].includes(me.role);
 const[st,ha,al_,ev,nw,ru,gv,us,au]=await Promise.all([
  must(sb.from('settings').select('*').eq('id',1).maybeSingle()),must(sb.rpc('has_admin')),
  must(sb.from('alliances').select('*').order('tag')),must(sb.from('events').select('*').order('date')),
  must(sb.from('news').select('*').order('created_at',{ascending:false})),must(sb.from('rules').select('*').order('sort').order('created_at')),
  pages(()=>sb.from(staff?'governors':'governors_public').select('*').order('id')),
  adm?must(sb.from('profiles').select('*').order('username')):[],
  me&&me.role==='super_admin'?must(sb.from('audit').select('*').order('id',{ascending:false}).limit(300)):[]]);
 HU=!!ha;
 D=Object.assign(empty(),{set:{name:st?.name||'Kingdom 3909',motto:st?.motto||'',king:st?.king||''},alliances:al_.map(fromDB),events:ev.map(fromDB),news:nw.map(fromDB),rules:ru.map(fromDB),governors:gv.map(fromDB),
  users:us.map(fromDB),audit:au.map(a=>({at:a.at,u:a.username,a:a.action,t:a.target,d:a.detail}))});
 route()}
const run=async f=>{try{await f()}catch(e){toast(e.message);const x=$('#fe');if(x)x.textContent=e.message}};
function backup(){const b=new Blob([JSON.stringify({exported_at:new Date().toISOString(),...D,audit:undefined},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kingdom3909-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,e=b.dataset.e,it=e&&D[e]?.find(x=>x.id===b.dataset.i);
 run(async()=>{
 if(a==='out'){await sb.auth.signOut();location.hash='';await refresh()}
 else if(a==='new'||a==='edit'){if(!can(e,it||null))return toast('Tidak diizinkan');modal(`<h2>${a==='new'?'Tambah':'Ubah'} ${E[e].t}</h2><form data-k="ent" data-e="${e}" data-i="${it?.id||''}">${E[e].f.map(f=>inp(f,it?.[f[0]]??'')).join('')}<div class="row"><button class="btn pri">Simpan</button><button type="button" class="btn" data-a="x">Batal</button></div></form>`)}
 else if(a==='x')modal('');
 else if(a==='del'){if(!canDel(e,it))return toast('Tidak diizinkan');modal(`<h2>Hapus data?</h2><p class="mu">${esc(it.name||it.title||it.username||it.tag)} akan dihapus permanen.</p><div class="row"><button class="btn dng" data-a="del2" data-e="${e}" data-i="${it.id}">Ya, hapus</button><button class="btn" data-a="x">Batal</button></div>`)}
 else if(a==='del2'){await must(sb.from(TB[e]).delete().eq('id',b.dataset.i));modal('');await refresh();toast('Dihapus')}
 else if(a==='exp')backup();
 else if(a==='demo'){const A=await must(sb.from('alliances').insert([['NFSH','Northern Fist'],['ROYL','Royal Guard'],['WOLF','Wolf Pack']].map((t,i)=>({tag:t[0],name:t[1],leader:'Leader '+(i+1),territory:'Zona '+(i+1)}))).select());
  const G=[];for(let i=1;i<=30;i++)G.push({game_id:String(10000000+i),name:'Governor '+i,alliance_id:A[i%3].id,power:Math.round(1.3e8/i**.5),kp:Math.round(3e9/i**.6),deads:Math.round(5e6/i**.4)});
  await must(sb.from('governors').insert(G));
  await must(sb.from('events').insert({title:'Ark of Osiris',date:new Date().toISOString().slice(0,10),category:'Kingdom',description:'Cek roster dan jadwal pertempuran.'}));
  await must(sb.from('news').insert({title:'Selamat datang di Royal Portal',category:'Penting',content:'Ini data contoh fiktif. Hapus dan ganti dengan data kingdom Anda.'}));
  await must(sb.from('rules').insert({title:'Saling menghormati',content:'Tidak ada toxic, spam, atau menyerang sesama anggota kingdom.',sort:1}));
  await refresh();toast('Data contoh ditambahkan')}})});
document.addEventListener('input',ev=>{const q=ev.target.dataset?.q;if(!q)return;const v=ev.target.value.toLowerCase();
 if(q==='g')$('#gl').innerHTML=topBy('power',500).filter(g=>(g.name+(al(g.allianceId)?.tag||'')).toLowerCase().includes(v)).map(rowG).join('');
 else document.querySelectorAll('#tb tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?'':'none')});
function parseCSV(t){const L=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!L.length)return[];const d=(L[0].match(/;/g)||[]).length>(L[0].match(/,/g)||[]).length?';':',';
 const sp=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch=='"')q=!q;else if(ch==d&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())};
 const h=sp(L[0]).map(x=>x.toLowerCase());return L.slice(1).map((l,i)=>{const v=sp(l),o={_n:i+2};h.forEach((k,j)=>o[k]=v[j]);return o})}
const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsText(f)});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target,k=f.dataset.k,fd=Object.fromEntries(new FormData(f));
 run(async()=>{
 if(k==='login'){const{error}=await sb.auth.signInWithPassword({email:toMail(fd.email),password:fd.p});if(error)throw new Error(/invalid/i.test(error.message)?'Username/email atau password salah':/confirm/i.test(error.message)?'Email belum dikonfirmasi. Cek kotak masuk Anda.':error.message);location.hash='admin';await refresh()}
  else if(k==='signup'){const{data,error}=await sb.auth.signUp({email:fd.email.trim(),password:fd.p,options:{data:{username:fd.u.trim()}}});if(error)throw new Error(error.message);
   if(data.session){location.hash='admin';await refresh();toast('Akun dibuat')}else{$('#fe').style.color='var(--ok)';$('#fe').textContent='Akun dibuat. Cek email untuk konfirmasi, lalu masuk.'}}
  else if(k==='ent'){const e=f.dataset.e,c=E[e],id=f.dataset.i,o={};
   for(const[kk,,t]of c.f)o[kk]=t==='n'?num(fd[kk]):String(fd[kk]??'').trim();
   if(me.role==='alliance_admin'&&c.f.some(x=>x[0]==='allianceId'))o.allianceId=me.allianceId;
   if(!o[c.f[0][0]]||(e!=='users'&&c.f[1]&&!o[c.f[1][0]]))throw new Error('Lengkapi kolom wajib');
   const row=toDB(o);if('alliance_id' in row)row.alliance_id=row.alliance_id||null;
   if(e==='users'){if(o.role==='alliance_admin'&&!o.allianceId)throw new Error('Pilih alliance untuk Alliance Admin');if(o.role!=='alliance_admin')row.alliance_id=null}
   if(id)await must(sb.from(TB[e]).update(row).eq('id',id));else await must(sb.from(TB[e]).insert(row));
   modal('');await refresh();toast('Tersimpan')}
  else if(k==='pw'){if(fd.p1!==fd.p2)throw new Error('Password tidak sama');const{error}=await sb.auth.updateUser({password:fd.p1});if(error)throw new Error(error.message);f.reset();toast('Password berhasil diganti')}
  else if(k==='set'){await must(sb.from('settings').update({name:fd.name.trim()||'Kingdom 3909',motto:fd.motto.trim(),king:fd.king.trim()}).eq('id',1));await refresh();toast('Pengaturan disimpan')}
  else if(k==='csv'){const rows=parseCSV(await rd(fd.f)),ex=new Set(D.governors.map(g=>g.gameId)),tag=Object.fromEntries(D.alliances.map(a=>[a.tag.toLowerCase(),a.id])),er=[],ok=new Map();let add=0,upd=0;
   for(const r of rows){const gid=String(r.game_id||'').trim(),nm=String(r.name||'').trim();if(!gid||!nm){er.push(`Baris ${r._n}: game_id/name kosong`);continue}
    const tg=String(r.alliance_tag||'').trim().toLowerCase(),aid=tag[tg]||null;if(tg&&!aid)er.push(`Baris ${r._n}: tag "${r.alliance_tag}" tidak dikenal (alliance dikosongkan)`);
    ok.set(gid,{game_id:gid,name:nm,alliance_id:aid,power:num(r.power),kp:num(r.kill_points),deads:num(r.deads)})}
   const arr=[...ok.values()];arr.forEach(r=>ex.has(r.game_id)?upd++:add++);
   for(let i=0;i<arr.length;i+=500)await must(sb.from('governors').upsert(arr.slice(i,i+500),{onConflict:'game_id'}));
   await refresh();$('#rep').innerHTML=`<div class="card"><b class="gold">Selesai:</b> ${add} governor baru, ${upd} diperbarui, ${er.length} catatan.<ul class="mu">${er.slice(0,30).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}})});
refresh().catch(e=>{$('#app').innerHTML=/Isi dulu/.test(e.message)?`<section class="card setup"><div class="k">LANGKAH TERAKHIR</div><h2>Hubungkan database Supabase</h2><ol><li>Buat project gratis di <b>supabase.com</b>.</li><li>Di <b>SQL Editor</b>, jalankan <code>supabase-setup.sql</code>, lalu <code>supabase-admin.sql</code> (membuat Super Admin).</li><li>Di <b>Project Settings → API</b>, salin <b>Project URL</b> dan <b>anon key</b> ke <code>config.js</code>.</li></ol><p class="mu">Panduan lengkap: PANDUAN.md</p></section>`:`<div class="card" style="margin-top:30px"><b>Gagal memuat data.</b><p class="mu">${esc(e.message)}</p><p class="mu">Periksa <code>config.js</code> dan pastikan <code>supabase-setup.sql</code> sudah dijalankan.</p></div>`});
</script></body></html>
